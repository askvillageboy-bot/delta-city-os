<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Delta City OS — Warri</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #map { width: 100%; height: 100%; }
      #map { position: absolute; top: 0; bottom: 0; }

      .overlay {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        background: rgba(15, 23, 42, 0.94); color: #f8fafc;
        padding: 12px 14px; border-radius: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        width: min(320px, calc(100vw - 24px));
        max-height: calc(100vh - 24px); overflow-y: auto;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      }
      .overlay h1 { font-size: 1.1rem; font-weight: 600; }
      .overlay .tagline { font-size: 0.75rem; color: #94a3b8; margin: 2px 0 8px; }
      .badge {
        display: inline-block; background: #0ea5e9; color: white;
        font-size: 0.65rem; padding: 2px 8px; border-radius: 999px; margin-bottom: 10px;
      }

      /* Session 11 — do-now strip */
      .do-now {
        background: linear-gradient(135deg, rgba(14,165,233,0.2), rgba(34,197,94,0.12));
        border: 1px solid rgba(14, 165, 233, 0.4);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .do-now-label {
        font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
        color: #38bdf8; font-weight: 700; margin-bottom: 6px;
      }
      .do-now-title {
        font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; line-height: 1.25;
      }
      .do-now-sub {
        font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.35;
      }
      .do-now-btn {
        width: 100%; border: none; border-radius: 8px; padding: 10px;
        background: #0ea5e9; color: white; font-size: 0.85rem; font-weight: 700;
        cursor: pointer;
      }
      .do-now-btn:active { transform: scale(0.98); }
      .do-now-btn.secondary { background: rgba(148,163,184,0.25); color: #e2e8f0; }
      .do-now-steps {
        display: flex; gap: 6px; margin-top: 10px;
      }
      .do-now-step {
        flex: 1; text-align: center; font-size: 0.62rem; color: #64748b;
        padding: 4px 2px; border-radius: 6px; background: rgba(15,23,42,0.4);
      }
      .do-now-step.on { color: #38bdf8; background: rgba(14,165,233,0.15); font-weight: 600; }
      .do-now-step.done { color: #22c55e; }

      .find-row { display: flex; gap: 8px; margin-bottom: 10px; }
      .find-row button {
        flex: 1; border: none; border-radius: 8px; padding: 8px 10px;
        font-size: 0.78rem; font-weight: 600; cursor: pointer;
      }
      #btn-find-me { background: #0ea5e9; color: white; }
      #btn-simulate-warri { background: rgba(148,163,184,0.2); color: #e2e8f0; }

      #near-you {
        background: rgba(14, 165, 233, 0.12);
        border: 1px solid rgba(14, 165, 233, 0.35);
        border-radius: 10px; padding: 10px; margin-bottom: 12px;
        font-size: 0.8rem;
      }
      .near-status { font-weight: 600; color: #38bdf8; margin-bottom: 4px; }
      .near-line { color: #cbd5e1; margin-top: 3px; line-height: 1.35; }
      .near-empty { color: #94a3b8; line-height: 1.4; }

      .layer-controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      .layer-item {
        display: flex; align-items: center; gap: 8px;
        font-size: 0.8rem; cursor: pointer;
      }
      .layer-item input { width: 14px; height: 14px; accent-color: #0ea5e9; }
      .swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid #fff; }
      .swatch.market { background: #22c55e; }
      .swatch.corridor { width: 16px; height: 3px; border-radius: 2px; background: #f97316; border: none; }
      .swatch.street-keeper { background: #3b82f6; }
      .swatch.promo { background: #eab308; }
      .swatch.dumpster { background: #ef4444; }

      .section-title {
        font-size: 0.68rem; color: #94a3b8; text-transform: uppercase;
        letter-spacing: 0.04em; margin: 12px 0 8px;
      }

      .quest-card {
        background: rgba(30, 41, 59, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 10px; padding: 10px; margin-bottom: 8px;
      }
      .quest-card.promo { border-color: rgba(234, 179, 8, 0.35); }
      .quest-card.civic { border-color: rgba(239, 68, 68, 0.3); }
      .quest-card.completed { border-color: #22c55e55; background: rgba(34,197,94,0.08); }
      .quest-header { display: flex; gap: 8px; margin-bottom: 8px; }
      .quest-icon { font-size: 1.2rem; }
      .quest-title { font-size: 0.85rem; font-weight: 600; }
      .quest-desc { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }
      .near-badge {
        display: inline-block; margin-top: 4px;
        font-size: 0.68rem; color: #38bdf8; font-weight: 600;
      }
      .far-badge {
        display: inline-block; margin-top: 4px;
        font-size: 0.68rem; color: #64748b;
      }

      .quest-progress { display: flex; align-items: center; gap: 8px; }
      .progress-bar { flex: 1; height: 6px; background: rgba(148,163,184,0.2); border-radius: 3px; overflow: hidden; }
      .progress-fill { height: 100%; background: #0ea5e9; border-radius: 3px; }
      .quest-card.completed .progress-fill { background: #22c55e; }
      .progress-text { font-size: 0.72rem; color: #94a3b8; }
      .quest-reward { margin-top: 6px; font-size: 0.7rem; color: #22c55e; }

      .promo-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .discount-tag {
        background: #eab308; color: #0f172a; font-size: 0.7rem; font-weight: 700;
        padding: 3px 8px; border-radius: 6px;
      }
      .points-tag {
        background: #ef4444; color: white; font-size: 0.7rem; font-weight: 700;
        padding: 3px 8px; border-radius: 6px;
      }
      .claim-btn, .civic-btn {
        background: #0ea5e9; color: white; border: none; border-radius: 6px;
        padding: 5px 10px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
      }
      .civic-btn { background: #ef4444; }
      .claimed-label { font-size: 0.72rem; color: #22c55e; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="overlay">
      <h1>Delta City OS</h1>
      <p class="tagline">Warri · deals, clean streets, your map</p>
      <span class="badge">Session 11</span>

      <div class="do-now" id="do-now">
        <!-- filled by JS -->
      </div>

      <div class="find-row">
        <button type="button" id="btn-find-me">Find me</button>
        <button type="button" id="btn-simulate-warri">Demo in Warri</button>
      </div>

      <div id="near-you"></div>

      <div class="layer-controls">
        <label class="layer-item">
          <input type="checkbox" id="toggle-markets" checked />
          <span class="swatch market"></span>
          <span>Markets</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" id="toggle-promos" checked />
          <span class="swatch promo"></span>
          <span>Offers</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" id="toggle-dumpsters" checked />
          <span class="swatch dumpster"></span>
          <span>Dumpsters</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" id="toggle-corridor" checked />
          <span class="swatch corridor"></span>
          <span>Sweeping zone</span>
        </label>
        <label class="layer-item">
          <input type="checkbox" id="toggle-live" checked />
          <span class="swatch street-keeper"></span>
          <span>Live teams</span>
        </label>
      </div>

      <div id="quest-list"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
